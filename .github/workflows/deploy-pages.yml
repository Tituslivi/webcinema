name: Deploy static content to Pages

# Desplega el contingut estàtic (JSON de sessions) a GitHub Pages.
# El repo és una API JSON pura amb .nojekyll: no cal Jekyll, només
# empaquetar l'arrel i publicar-la via l'acció oficial deploy-pages.
# Substitueix la canonada legacy "Deploy from a branch", que és fràgil.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Un sol desplegament concurrent; no cancel·lem el que ja corre per no
# deixar el lloc a mig publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Publica tot el repo tal qual: /manifest.json, /latest.json,
          # /cinemas/…, etc. Les URL no canvien.
          path: '.'
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          include-hidden-files: true

      # L'índex d'artefactes pot trigar a reflectir la pujada. Cada intent
      # té un nom propi perquè l'índex també conserva intents anteriors.
      - name: Wait for the uploaded artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ -z "$EXPECTED_ARTIFACT_ID" ]]; then
            echo '::error::The upload did not return an artifact ID.'
            exit 1
          fi
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME"
          for delay in 0 1 2 4 8 15; do
            sleep "$delay"
            if visible_id=$(gh api "$endpoint" --jq '.artifacts[] | select(.expired == false) | .id') \
              && [[ "$visible_id" == "$EXPECTED_ARTIFACT_ID" ]]; then
              echo "Artifact $PAGES_ARTIFACT_NAME ($visible_id) is visible."
              exit 0
            fi
          done
          echo "::error::Artifact $PAGES_ARTIFACT_NAME ($EXPECTED_ARTIFACT_ID) did not become visible."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
